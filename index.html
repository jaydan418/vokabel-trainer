<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1c2340;--mute:#6b7391;--line:#dde1ef;--accent:#4a45e0;--ok:#1f9d55;--okbg:#dff5e8;--bad:#d64545;--badbg:#fde4e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152a;--card:#1b1f3a;--ink:#eceffd;--mute:#98a0c4;--line:#2d3358;--accent:#8b87ff;--ok:#4ade80;--okbg:#153b2a;--bad:#ff7b7b;--badbg:#472026}}
:root[data-theme="dark"]{--bg:#12152a;--card:#1b1f3a;--ink:#eceffd;--mute:#98a0c4;--line:#2d3358;--accent:#8b87ff;--ok:#4ade80;--okbg:#153b2a;--bad:#ff7b7b;--badbg:#472026}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 24px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
h2{font-size:1.1rem;margin:0 0 12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;flex:1 1 140px;min-width:0}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:2px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
#quiz{transition:background .2s,border-color .2s}
#quiz.ok{background:var(--okbg);border-color:var(--ok)}
#quiz.bad{background:var(--badbg);border-color:var(--bad)}
.q{font-size:2rem;font-weight:800;margin:4px 0 14px;overflow-wrap:anywhere}
#msg{min-height:1.5em;margin:10px 0 0;font-weight:600}
.ok #msg{color:var(--ok)}.bad #msg{color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 14px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;transition:background .2s,border-color .2s}
li.done{background:var(--okbg);border-color:var(--ok)}
li .w{font-weight:600;flex:1;overflow-wrap:anywhere}
li .t{color:var(--mute);flex:1;overflow-wrap:anywhere}
li.done .t{color:var(--ink)}
li button{padding:4px 10px;background:transparent;color:var(--mute);font-size:1.2rem}
.empty{color:var(--mute);margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.head h2{margin:0}
</style>
</head>
<body>
<main>
<h1>Word Trainer</h1>
<p class="sub">Add as many words as you like, then test yourself.</p>

<section>
<h2>Add a word</h2>
<div class="row">
<input id="w" placeholder="Word" autocomplete="off" aria-label="Word">
<input id="t" placeholder="Translation (use , for several)" autocomplete="off" aria-label="Translation">
<button id="add">Add word</button>
</div>
</section>

<section id="quiz">
<h2>Practice</h2>
<div class="bar"><i id="fill"></i></div>
<div id="qbody"></div>
</section>

<section>
<div class="head"><h2 id="count">Your words</h2><button class="ghost" id="reset">Reset progress</button></div>
<ul id="list"></ul>
</section>
</main>

<script>
let words=[];let cur=null;let locked=false;
const $=id=>document.getElementById(id);
try{words=JSON.parse(localStorage.getItem("wt_words")||"[]")}catch(e){words=[]}
function save(){try{localStorage.setItem("wt_words",JSON.stringify(words))}catch(e){}}
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
const answers=t=>t.split(/[,\/;]/).map(norm).filter(Boolean);

function renderList(){
  const ul=$("list");ul.innerHTML="";
  const done=words.filter(x=>x.done).length;
  $("count").textContent="Your words ("+done+" of "+words.length+" learned)";
  $("fill").style.width=words.length?(done/words.length*100)+"%":"0";
  $("reset").disabled=!done;
  if(!words.length){ul.innerHTML='<p class="empty">No words yet. Add your first one above.</p>';return}
  words.forEach((x,i)=>{
    const li=document.createElement("li");if(x.done)li.className="done";
    li.innerHTML='<span class="w"></span><span class="t"></span><button aria-label="Delete word">×</button>';
    li.children[0].textContent=x.w;li.children[1].textContent=x.t;
    li.children[2].onclick=()=>{words.splice(i,1);save();if(cur===x)cur=null;renderList();nextQ()};
    ul.appendChild(li);
  });
}

function nextQ(){
  const q=$("quiz"),b=$("qbody");q.className="";locked=false;
  const open=words.filter(x=>!x.done);
  if(!words.length){cur=null;b.innerHTML='<p class="empty">Add a word to start practicing.</p>';return}
  if(!open.length){cur=null;b.innerHTML='<p class="q">All words learned 🎉</p><p class="empty">Reset progress to practice again.</p>';return}
  let pool=open.length>1?open.filter(x=>x!==cur):open;
  cur=pool[Math.floor(Math.random()*pool.length)];
  b.innerHTML='<div class="q"></div><div class="row"><input id="a" placeholder="Type the translation" autocomplete="off" aria-label="Your answer"><button id="check">Check</button></div><p id="msg"></p>';
  b.querySelector(".q").textContent=cur.w;
  $("check").onclick=check;
  $("a").onkeydown=e=>{if(e.key==="Enter")check()};
  $("a").focus();
}

function check(){
  const q=$("quiz");
  if(locked){nextQ();return}
  const v=norm($("a").value);if(!v)return;
  if(answers(cur.t).includes(v)){
    cur.done=true;save();locked=true;q.className="ok";
    $("msg").textContent="Correct!";$("check").textContent="Next";renderList();
  }else{
    q.className="bad";$("msg").textContent="Not quite. Answer: "+cur.t;
    locked=true;$("check").textContent="Next";
  }
}

function addWord(){
  const w=$("w").value.trim(),t=$("t").value.trim();
  if(!w||!t){(w?$("t"):$("w")).focus();return}
  words.push({w,t,done:false});save();
  $("w").value="";$("t").value="";$("w").focus();
  renderList();if(!cur||!document.getElementById("a"))nextQ();
}
$("add").onclick=addWord;
$("t").onkeydown=e=>{if(e.key==="Enter")addWord()};
$("reset").onclick=()=>{words.forEach(x=>x.done=false);save();renderList();nextQ()};
renderList();nextQ();
</script>
</body>
</html>
